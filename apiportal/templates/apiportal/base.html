<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Formula1 API Client Management Tool{% endblock %}</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header, .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
        }
        .header img {
            height: 40px;
            cursor: pointer;
        }
        .nav-links {
            display: flex;
            align-items: center;
        }
        .nav-links a {
            color: #d90404;
            text-decoration: none;
            font-weight: 500;
            padding: 0 15px;
            position: relative;
        }
        .nav-links a:not(:last-child)::after {
            content: "|";
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            color: #ccc;
        }
        .content {
            padding: 20px 40px;
            flex: 1; /* This allows the content to expand to fill space, pushing the footer down */
            width: 100%;
            box-sizing: border-box;
        }
        .footer {
            border-top: 1px solid #ddd;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="{% url 'index' %}">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/F1_%28registered_trademark%29.svg/250px-F1_%28registered_trademark%29.svg.png" alt="F1 Logo">
        </a>
        <div class="nav-links">
            <a href="{% url 'client_scopes' %}">Client Scopes</a>
            <a href="{% url 'new_client' %}">Create New Client</a>
        </div>
    </div>
    <div class="content">
        {% block content %}
        <!-- Page-specific content will go here -->
        {% endblock %}
    </div>
    <div class="footer">
        <span>This a just a demo project</span>
        <span>Copyright © 2025 Yu Wong All rights reserved. </span>
    </div>
</body>
</html>
